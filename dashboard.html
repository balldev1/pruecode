<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      html,
      /* ให้เต็มหน้าจอแนวตั้ง */
      body {
        background-color: rgb(22, 19, 19);
        height: 100%;
      }
      .menu-item:hover {
        background-color: var(--bs-primary) !important;
        color: white !important;
      }
      .menu-item:hover i {
        color: white !important;
      }
      .no-border {
        text-decoration: none;
        outline: none !important;
        box-shadow: none !important;
        border: none !important;
      }
    </style>
  </head>
  <body class="d-flex h-100 bg-dark text-white">
    <!-- sidebar -->
    <div class="d-flex flex-column gap-2 p-4" style="width: 25%">
      <a href="/login.html" class="no-border d-flex align-items-center gap-2">
        <img
          src="public/logo.png"
          class="img-fluid"
          style="width: 20%"
          alt="Logo" />
        <h2 class="m-0 text-white fs-4 fw-bold">balldevnaja</h2>
      </a>
      <div
        class="position-relative bg-white d-flex text-black p-2 mt-4 rounded-3">
        <img
          src="public/logo.png"
          class="img-fluid"
          style="width: 24%; height: 100%"
          alt="Logo" />
        <div>
          <div class="fw-bold">Rework</div>
          <div style="font-size: 0.85rem">rework@balldev.com</div>
        </div>
        <div class="position-absolute top-50 end-0 mx-2 translate-middle-y">
          <i class="bi bi-caret-down-square-fill"></i>
        </div>
      </div>
      <div class="mt-4 d-flex flex-column gap-2">
        <h2 class="fs-6 text-light">Main Menu</h2>
        <div
          class="d-flex align-items-center text-black gap-3 bg-primary-subtle menu-item rounded-3 p-2 px-3"
          style="cursor: pointer">
          <i class="bi fs bi-house-add text-black"></i>
          <h2 class="fs-6 mt-2">Dashboard</h2>
        </div>
        <div
          class="d-flex align-items-center gap-3 text-white menu-item rounded-3 p-2 px-3"
          style="cursor: pointer">
          <i class="bi bi-list-task"></i>
          <h2 class="fs-6 mt-2">Task</h2>
        </div>
        <div
          class="position-relative d-flex align-items-center gap-3 text-white menu-item rounded-3 p-2 px-3"
          style="cursor: pointer">
          <i class="bi bi-inbox-fill"></i>
          <h2 class="fs-6 mt-2">Inbox</h2>
          <div
            class="badge text-bg-primary position-absolute top-50 end-0 translate-middle">
            4
          </div>
        </div>
        <div
          class="d-flex align-items-center gap-3 text-white menu-item rounded-3 p-2 px-3"
          style="cursor: pointer">
          <i class="bi bi-calendar-check-fill"></i>
          <h2 class="fs-6 mt-2">Calendar</h2>
        </div>
      </div>
    </div>
    <!-- body -->
    <div class="bg-white text-black my-2 mx-4 rounded-4 w-100 p-3">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <h2 class="text-black fw-bold fs-4">Darshboard</h2>
          <h2 class="text-black text-black-50" style="font-size: 0.85rem">
            Explore your need here
          </h2>
        </div>
        <div class="text-black d-flex gap-3">
          <button type="button" class="d-flex gap-2 btn border">
            <i class="bi bi-calendar-check-fill"></i>
            Jauary
          </button>
          <a
            href="/navbar.html"
            type="button"
            class="btn btn-primary d-flex gap-2">
            <i class="bi bi-upload"></i>
            Export
          </a>
        </div>
      </div>

      <!-- id จาก jquery -->
      <div id="total_1" class="row p-3 gap-4 mt-2"></div>
      <!-- chart -->
      <div class="d-flex gap-4 align-items-stretch">
        <!-- chart -->
        <div class="border p-3 rounded-4 h-90" style="width: 50%">
          <div class="d-flex align-items-center justify-content-between">
            <h2 class="m-0 fs-6">Average Team KPI</h2>
            <i class="m-0 bi bi-grip-horizontal border px-1 rounded-2"></i>
          </div>
          <div class="mt-4">
            <h2 class="fs-1 fw-bold">82.10%</h2>
            <div class="d-flex gap-2">
              <h2 class="fs-6 text-success">
                <i class="bi bi-caret-up-fill"></i>
                10%
              </h2>
              <h2 class="fs-6 text-black-50 fw-normal">vs last month 72%</h2>
            </div>
            <canvas id="chart_1"></canvas>
          </div>
        </div>
        <!-- table -->
        <div id="table_1" class="w-100 h-90 border p-3 rounded-4"></div>
      </div>

      <!-- import -->
      <script src="js/dashboard/total.js"></script>
      <script src="js/dashboard/chart.js"></script>
      <script src="js/dashboard/table.js"></script>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pure SPA Example</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
      html,
      /* ให้เต็มหน้าจอแนวตั้ง */
      body {
        height: 100%;
      }
    </style>
  </head>
  <body class="">
    <div class="row h-100">
      <div
        class="col d-flex align-items-center justify-content-center"
        style="
          background-image: url('public/login.webp');
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
          height: 100%;
        "></div>
      <div
        class="position-relative col d-flex flex-column gap-1 justify-content-center">
        <div
          class="d-flex flex-column gap-2 align-items-center"
          style="margin-left: 10rem; margin-right: 10rem">
          <img
            src="public/logo.png"
            alt="logo.png"
            width="100"
            height="100"
            style="cursor: pointer"
            class="p-3 cursor-pointer rounded-circle shadow bg-light" />
          <h2>Hello Again!</h2>
          <span class="text-center text-black-50" style="font-size: 0.85rem"
            >Lorem ipsum dolor sit amet consectetur adipisicing elit. Molestiae,
            aliquam ab quidem dolore illo eos fugiat corporis molestias itaque
            .</span
          >
        </div>
        <div
          class="d-flex flex-column gap-2 mt-4"
          style="margin-left: 10rem; margin-right: 10rem">
          <div>
            <label for="exampleFormControlInput1" class="form-label fw-semibold"
              >Email address</label
            >
            <input
              type="email"
              class="form-control"
              id="exampleFormControlInput1"
              placeholder="name@example.com" />
          </div>
          <div>
            <label for="exampleFormControlInput1" class="form-label fw-semibold"
              >Password</label
            >
            <input
              type="passowrd"
              class="form-control"
              id="exampleFormControlInput1"
              placeholder="name@example.com" />
          </div>
          <a href="/register.html" type="button" class="btn mt-2 btn-primary">
            <span>Click here</span>
          </a>
        </div>
        <div
          class="position-absolute bottom-0 pb-3 start-50 translate-middle-x">
          <h2 style="font-size: 0.85rem" class="text-black-50">
            Don't have an account yet?
            <span class="text-primary"> Sign up </span>
          </h2>
        </div>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
